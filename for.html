<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gim Tebak Kata Pro - Multiple Choice</title>
    <style>
        :root {
            --primary: #4F46E5;
            --secondary: #8B5CF6;
            --bg: #F3F4F6;
            --text: #1F2937;
            --card: #FFFFFF;
            --success: #10B981;
            --error: #EF4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        
        #menu-screen { display: block; }
        #game-screen { display: none; }
        #result-screen { display: none; }
        
        h1 { margin-top: 0; color: var(--primary); }
        h2 { color: #4B5563; font-size: 1.2rem; margin-bottom: 2rem; }
        
        .badge {
            display: inline-block;
            background-color: #E0E7FF;
            color: var(--primary);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .clue {
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
            text-align: left;
            background: #F9FAFB;
            padding: 1rem;
            border-radius: 0.5rem;
            border-left: 4px solid var(--primary);
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        button:hover { background-color: #4338CA; }
        
        .btn-option {
            background-color: #F3F4F6;
            color: var(--text);
            border: 2px solid #E5E7EB;
            text-align: left;
            padding: 0.75rem 1rem;
            font-weight: 500;
        }
        .btn-option:hover {
            background-color: #E0E7FF;
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .btn-receh { background-color: var(--secondary); }
        .btn-receh:hover { background-color: #7C3AED; }
        
        .skor-box {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-weight: 600;
            color: #6B7280;
        }
    </style>
</head>
<body>

<!-- LAYAR MENU UTAMA -->
<div class="container" id="menu-screen">
    <h1>Tebak Kata</h1>
    <h2>Pilih Mode Permainan (Pilihan Ganda)</h2>
    <button onclick="pilihMode('ilmu')">📚 Mode Ilmu (10 Soal Akademik)</button>
    <button class="btn-receh" onclick="pilihMode('receh')">🎮 Mode Receh (10 Soal Pop Kultur)</button>
</div>

<!-- LAYAR PERMAINAN -->
<div class="container" id="game-screen">
    <h1>Tebak Kata</h1>
    <div class="skor-box">
        <span id="soal-progress">Soal: 1/10</span>
        <span id="score-display">Skor: 0</span>
    </div>
    
    <div id="kategori" class="badge">Kategori</div>
    <div id="petunjuk" class="clue">Petunjuk muncul di sini</div>
    
    <div class="options-container" id="options-box">
        <!-- Tombol pilihan ganda dimuat lewat JavaScript -->
    </div>
</div>

<!-- LAYAR SELESAI -->
<div class="container" id="result-screen">
    <h1>Permainan Selesai! 🎉</h1>
    <p style="font-size: 1.2rem; margin: 1.5rem 0;">Skor akhir Anda: <strong id="final-score" style="color: var(--primary);">0</strong> dari 100</p>
    <button onclick="location.reload()">Main Lagi</button>
</div>

<script>
    // 10 SOAL MODE ILMU (AKADEMIK)
    const bankIlmu = [
        { kategori: "Pemrograman", petunjuk: "Notasi rancangan logika pemrograman sebelum diterjemahkan ke bahasa pemrograman nyata.", pilihan: ["Pseudocode", "Bytecode", "Syntax", "Compiler"], jawaban: "Pseudocode" },
        { kategori: "Kimia", petunjuk: "Cabang ilmu kimia yang berhubungan dengan perhitungan kuantitatif rasio massa reaktan dan produk.", pilihan: ["Termokimia", "Stoikiometri", "Elektrokimia", "Struktur Atom"], jawaban: "Stoikiometri" },
        { kategori: "Fisika", petunjuk: "Jenis energi mekanik yang merupakan jumlah dari energi kinetik dan energi potensial.", pilihan: ["Energi Panas", "Energi Mekanik Total", "Energi Listrik", "Energi Nuklir"], jawaban: "Energi Mekanik Total" },
        { kategori: "Matematika", petunjuk: "Cabang matematika yang mempelajari hubungan meliputi panjang dan sudut segitiga.", pilihan: ["Aljabar", "Trigonometri", "Kalkulus", "Statistika"], jawaban: "Trigonometri" },
        { kategori: "Komputer", petunjuk: "Diagram alir yang digunakan untuk merepresentasikan algoritma atau proses logika secara visual.", pilihan: ["Flowchart", "Wireframe", "Mindmap", "Database Schema"], jawaban: "Flowchart" },
        { kategori: "Biologi", petunjuk: "Organel sel yang berfungsi sebagai tempat berlangsungnya respirasi seluler dan penghasil energi.", pilihan: ["Ribosom", "Mitokondria", "Lisosom", "Badan Golgi"], jawaban: "Mitokondria" },
        { kategori: "Ekonomi", petunjuk: "Situasi di mana kebutuhan manusia tidak terbatas sementara alat pemuas kebutuhan terbatas.", pilihan: ["Inflasi", "Kelangkaan", "Monopoli", "Deflasi"], jawaban: "Kelangkaan" },
        { kategori: "Sejarah", petunjuk: "Perjanjian pembagian wilayah Hindia Belanda antara Inggris dan Belanda pada tahun 1814.", pilihan: ["Konvensi London", "Perjanjian Linggarjati", "Perjanjian Bongaya", "Rangkuman Salatiga"], jawaban: "Konvensi London" },
        { kategori: "Bahasa Indonesia", petunjuk: "Bagian teks eksposisi atau negosiasi yang berisi pendapat awal atau pandangan penulis disebut...", pilihan: ["Tesis", "Argumentasi", "Klimaks", "Reorientasi"], jawaban: "Tesis" },
        { kategori: "Sosiologi", petunjuk: "Proses penyesuaian unsur-unsur yang berbeda dalam kebudayaan sehingga mencapai keselarasan.", pilihan: ["Asimilasi", "Akulturasi", "Integrasi Sosial", "Difusi"], jawaban: "Integrasi Sosial" }
    ];

    // 10 SOAL MODE RECEH (KULTUR & HOBI)
    const bankReceh = [
        { kategori: "Event Wibu", petunjuk: "Acara konvensi kreator pop kultur besar tempat khilaf beli merch yang sering diadakan di ICE BSD.", pilihan: ["Anime Festival Asia", "Comic Frontier", "Japan Fest", "Indonesia Comic Con"], jawaban: "Comic Frontier" },
        { kategori: "Gim Moba", petunjuk: "Gim multiplayer seluler yang sering bikin darah tinggi pas solo rank ketemu player toxic.", pilihan: ["Mobile Legends", "Free Fire", "Genshin Impact", "Roblox"], jawaban: "Mobile Legends" },
        { kategori: "Anime", petunjuk: "Serial anime tentang reinkarnasi misterius menjadi anak dari seorang idol terkenal.", pilihan: ["Oshi no Ko", "Blue Box", "Solo Leveling", "Demon Slayer"], jawaban: "Oshi no Ko" },
        { kategori: "Gym Bro", petunjuk: "Mesin latihan di gym yang berfokus melatih kekuatan otot paha dan kaki dengan posisi duduk atau rebahan.", pilihan: ["Lat Pulldown", "Leg Press", "Chest Press", "Cable Crossover"], jawaban: "Leg Press" },
        { kategori: "Light Novel", petunjuk: "Seri mecha militer tentang perang diskriminasi skuadron tanpa nama yang ceritanya cukup emosional.", pilihan: ["Eighty Six", "Sword Art Online", "Classroom of the Elite", "Re:Zero"], jawaban: "Eighty Six" },
        { kategori: "Kultur Pop", petunjuk: "Platform belanja in-game top-up populer bagi gamer mobile di Indonesia selain Codashop.", pilihan: ["Lapakgaming", "Tokopedia", "ShopeePay", "DANA Gaming"], jawaban: "Lapakgaming" },
        { kategori: "Gacha Game", petunjuk: "Gim open-world populer buatan HoYoverse dengan elemen tujuh elemen elemen teyvat.", pilihan: ["Honkai: Star Rail", "Genshin Impact", "Zenless Zone Zero", "Wuthering Waves"], jawaban: "Genshin Impact" },
        { kategori: "Parfum", petunjuk: "Brand lokal eau de parfum Indonesia yang variannya sering diburu anak muda untuk harian.", pilihan: ["Aoera Indonesia", "Kahf", "HMNS", "Mine. Perfumery"], jawaban: "Aoera Indonesia" },
        { kategori: "Otomotif", petunjuk: "Jenis bahan bakar bensin non-subsidi Pertamina dengan oktan tinggi (RON 98).", pilihan: ["Pertalite", "Pertamax", "Pertamax Turbo", "Solar"], jawaban: "Pertamax Turbo" },
        { kategori: "Sinema", petunjuk: "Bioskop jaringan populer di Indonesia yang sering dikunjungi untuk nonton film box office terbaru.", pilihan: ["CGV Cinemas", "XXI", "Cinepolis", "Platinum Cineplex"], jawaban: "XXI" }
    ];

    let soalTersedia = [];
    let indeksSoal = 0;
    let skor = 0;

    function pilihMode(mode) {
        if (mode === 'ilmu') {
            soalTersedia = [...bankIlmu];
        } else {
            soalTersedia = [...bankReceh];
        }
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        muatSoal();
    }

    function muatSoal() {
        if (indeksSoal >= soalTersedia.length) {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerText = skor;
            return;
        }

        const current = soalTersedia[indeksSoal];
        document.getElementById('soal-progress').innerText = `Soal: ${indeksSoal + 1}/10`;
        document.getElementById('score-display').innerText = `Skor: ${skor}`;
        document.getElementById('kategori').innerText = current.kategori;
        document.getElementById('petunjuk').innerText = current.petunjuk;

        // Acak urutan pilihan ganda agar posisinya dinamis
        let shuffledOptions = [...current.pilihan].sort(() => Math.random() - 0.5);

        let optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = "";

        shuffledOptions.forEach(opsi => {
            let btn = document.createElement('button');
            btn.className = "btn-option";
            btn.innerText = opsi;
            btn.onclick = () => cekJawaban(opsi, current.jawaban);
            optionsBox.appendChild(btn);
        });
    }

    function cekJawaban(pilihanUser, jawabanBenar) {
        if (pilihanUser === jawabanBenar) {
            skor += 10;
        }
        indeksSoal++;
        muatSoal();
    }
</script>

</body>
</html>
